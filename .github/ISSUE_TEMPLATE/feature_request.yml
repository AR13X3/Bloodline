name: Idea or feature request
description: Suggest something BloodLine should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What's hard or missing today, and for whom (GP, practice nurse, practice manager, patient)?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How BloodLine could help. Sketches and examples are welcome.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Links to guidelines, standards or other tools that do this well.
  - type: checkboxes
    id: privacy
    attributes:
      label: Patient privacy
      options:
        - label: This request contains no real patient information.
          required: true
